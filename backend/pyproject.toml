[project]
name = "tripbranch-backend"
version = "0.1.0"
description = "TripBranch FastAPI backend scaffold"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "sse-starlette>=2.1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "google-genai>=1.0",
  # D-062: Supabase 신원 토큰(ES256) 검증. crypto extra가 있어야 EC 서명을 다룬다.
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]
# package_D 취향 근거 RAG 스크립트 전용(scripts/measure_similarity_distribution.py).
# torch를 끌고 와 설치가 무거워 기본 설치·dev extras에는 안 넣는다. 모델 가중치
# (jhgan/ko-sroberta-multitask)는 첫 실행 시 Hugging Face Hub에서 자동 다운로드된다.
embeddings = [
  "sentence-transformers>=5.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "smoke: calls real external providers and requires explicit environment opt-in",
  "inspection: prints sanitized real provider requests and raw responses",
]
