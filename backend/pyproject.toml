[project]
name = "tripbranch-backend"
version = "0.1.0"
description = "TripBranch FastAPI backend scaffold"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "sse-starlette>=2.1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "google-genai>=1.0",
  # D-062: Supabase 신원 토큰(ES256) 검증. crypto extra가 있어야 EC 서명을 다룬다.
  "pyjwt[crypto]>=2.8",
  # 인텐트 라우팅 그래프(docs/design/langgraph-adoption.md). 1단계는 GENERAL 경로만
  # 그래프로 태우고 나머지는 기존 run_agent_flow()가 그대로 처리한다.
  # langchain-core가 의존성으로 함께 설치된다(langchain 본체·통합 패키지는 아님).
  "langgraph>=1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  # tests/prompts/test_prompt_assets.py가 app/prompts/*/meta.yaml을 파싱해 선언(template·
  # bundle)과 실제 조합이 어긋나지 않는지 검사한다. 런타임은 Markdown만 읽으므로
  # 기본 의존성에는 넣지 않는다.
  "pyyaml>=6.0",
]
# package_D 취향 근거 RAG 스크립트 전용(scripts/measure_similarity_distribution.py).
# torch를 끌고 와 설치가 무거워 기본 설치·dev extras에는 안 넣는다. 모델 가중치
# (jhgan/ko-sroberta-multitask)는 첫 실행 시 Hugging Face Hub에서 자동 다운로드된다.
embeddings = [
  "sentence-transformers>=5.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "smoke: calls real external providers and requires explicit environment opt-in",
  "inspection: prints sanitized real provider requests and raw responses",
]
