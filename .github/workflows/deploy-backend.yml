name: Deploy backend

on:
  push:
    # feature/docker-deploy는 첫 배포를 검증하는 동안만 둔다. 머지 후에는 지운다.
    branches: [main, feature/docker-deploy]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# 배포가 겹치면 EC2에서 컨테이너를 서로 내리고 올려 상태를 알 수 없게 된다.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: tripbranch-backend
  INSTANCE_ID: i-0a8ed28ea7152c592
  CONTAINER_NAME: tripbranch-backend

jobs:
  deploy:
    name: Build image and deploy to EC2
    runs-on: ubuntu-latest
    # OIDC로 AWS 역할을 맡는다. 공개 저장소라 만료되지 않는 액세스 키를
    # Secrets에 두지 않는다 — 실행할 때마다 짧게 사는 토큰을 받아쓴다.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::577101745292:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -f backend/Dockerfile -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:latest" backend
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"

      - name: Deploy on EC2 via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $IMAGE_TAG" \
            --parameters commands="[
              \"set -euo pipefail\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY\",
              \"docker pull $IMAGE\",
              \"docker rm -f $CONTAINER_NAME 2>/dev/null || true\",
              \"docker run -d --name $CONTAINER_NAME --restart unless-stopped -p 127.0.0.1:8000:8000 --env-file /opt/tripbranch/.env $IMAGE\",
              \"for i in \\$(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health >/dev/null && echo health-ok && break; sleep 5; done\",
              \"curl -fsS http://127.0.0.1:8000/api/health >/dev/null || { docker logs --tail 50 $CONTAINER_NAME; exit 1; }\",
              \"docker image prune -af --filter until=72h >/dev/null\"
            ]" \
            --query Command.CommandId --output text)

          echo "SSM command: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
            echo "deploy failed: $STATUS"
            exit 1
          fi
