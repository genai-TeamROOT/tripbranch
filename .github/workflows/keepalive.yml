name: Keepalive ping

# **무료 플랜 유휴 정지를 막는 쓰기만 담당한다.** 세션 정리(cleanup-sessions.yml)에
# 얹지 않고 따로 둔 이유: 그쪽은 목적이 세션 정리고, 지울 세션이 없는 날에는 select만
# 나간다. 2026-11-23 정지 예정 경고가 그렇게 왔다 — 11-17부터 7일간 지울 세션이 없어
# 조회만 나갔고, 조회는 활동으로 집계되지 않는다. 따로 두면 한쪽이 실패해도 다른
# 쪽이 돈다.
#
# 실행 대상은 backend/scripts/ping_database.py다. keepalive_pings 표의 행 하나를
# 갱신하는 것뿐이고 되돌릴 것이 없다.
#
# **예약 실행은 기본 브랜치(main)에 있는 파일만 돈다.** cleanup-sessions.yml이
# 2026-09-15에 만들어졌지만 develop에만 있어서 10-19 머지(#458)까지 한 번도 돌지
# 않았다. 이 파일도 main에 들어가야 동작한다.
#
# GitHub은 예약 시각을 보장하지 않는다 — cleanup 쪽 실측으로 2~4시간 밀렸다.
# 하루 세 번 두는 이유 중 하나가 그것이고, 다른 하나는 공식 문서가 "하루 몇 건의
# 요청"이라고만 말해 한 건으로 충분한지 확인할 수 없다는 점이다.
on:
  schedule:
    # KST 10:00 / 18:00 / 다음날 02:00. 세션 정리(UTC 18:00 예약)와 겹치지 않게 뒀다.
    - cron: "0 1,9,17 * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m scripts.ping_database --source github-actions
